<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f7;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Helvetica Neue',
          Arial,
          sans-serif;
      }

      .spa-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .spa-loading__spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(10, 132, 255, 0.2);
        border-top-color: #0a84ff;
        animation: spa-loading-spin 0.8s linear infinite;
      }

      .spa-loading__label {
        color: #6e6e73;
        font-size: 14px;
      }

      @keyframes spa-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #1c1c1e;
        }

        .spa-loading__label {
          color: #98989d;
        }
      }
    </style>
  </head>
  <body>
    <div class="spa-loading">
      <div class="spa-loading__spinner"></div>
      <div class="spa-loading__label">Safari History Detail を読み込み中…</div>
    </div>
  </body>
</html>
