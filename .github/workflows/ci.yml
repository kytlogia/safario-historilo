name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint / Format / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # registry.npmjs.org's advisories API intermittently stalls for extended
      # periods (#216); pnpm's own retry budget (~4m10s) isn't always enough,
      # so fail each attempt fast and let nick-fields/retry spread several
      # attempts across a few minutes of wall time instead.
      - name: Audit dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 2
          max_attempts: 5
          retry_wait_seconds: 60
          command: pnpm audit --audit-level=high
        env:
          npm_config_fetch_retries: "1"
          npm_config_fetch_retry_mintimeout: "5000"
          npm_config_fetch_retry_maxtimeout: "15000"
          npm_config_fetch_timeout: "30000"

  e2e:
    name: E2E tests (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

  # Windows support (#138): the OS-specific bits (server/utils/history-store.ts,
  # firefox-profiles.ts, safari-profiles.ts) only branch on process.platform at
  # runtime, so lint/format/typecheck don't need a Windows run — only actually
  # executing the suite on windows-latest can catch a Windows regression there.
  windows:
    name: Test / Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
