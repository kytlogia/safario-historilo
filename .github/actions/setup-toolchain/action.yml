name: Setup toolchain
description: Set up pnpm/Node.js with dependency caching and install dependencies (shared by all CI jobs). Must run after actions/checkout, since GitHub Actions needs the repo checked out to resolve this local composite action in the first place.

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
