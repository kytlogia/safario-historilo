# postinstall等のビルドスクリプト実行を明示的に許可したパッケージのみに限定する（依存パッケージ経由の任意コード実行対策）。
# 新しい依存を追加してビルドスクリプトの許可が必要になった場合は、本当に必要か（ネイティブアドオンのビルド等、代替がないか）を確認してから追加すること。
allowBuilds:
  esbuild: true

# サプライチェーン攻撃対策: 公開されたばかりのバージョンを一定時間インストールしない（乗っ取られたアカウントからの悪意あるバージョン公開は
# 検知・削除まで数時間〜半日程度かかることが多いため）。pnpm 11以降はデフォルトで有効（1440分=24時間）だが、
# バージョンに依存せず常に有効になるよう明示設定する。 https://pnpm.io/supply-chain-security
minimumReleaseAge: 1440
# 該当バージョンが上記期間内で他に候補が無い場合、古いバージョンへ自動フォールバックせずインストール自体を失敗させる
# （個人開発規模では、気づかないままフォールバックされるより失敗して気づける方が安全という判断）。
# minimumReleaseAge を明示設定した場合、pnpm 11のデフォルトも true だが、意図を明確にするため明示している。
minimumReleaseAgeStrict: true
# 緊急のセキュリティパッチ等ですぐ上げたい特定パッケージがある場合は、以下のように除外できる:
# minimumReleaseAgeExclude:
#   - some-package
#   - '@some-scope/*'
